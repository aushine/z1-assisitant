# =============================================================
# Z1 生活助手 · 生产 nginx 配置（树莓派原生 nginx，仅监听 80，单域名路径区分）
# 访问：
#   桌面端  https://voz21.cn/z1/
#   移动端  https://voz21.cn/z1-app/
# 内网穿透：Cloudflare Tunnel 把 voz21.cn -> 本机 :80（无需开防火墙端口）
#
# 版本说明（2026-09-19）：
#   两端前端已按子路径 base 重新构建（桌面 --base=/z1/，移动 --base=/z1-app/），
#   产物内所有资源引用（assets/favicon/manifest/logo）都是正确的子路径绝对地址，
#   路由 basename 也已跟随 base —— 不再需要 sub_filter 改写，深层链接/刷新均正常。
#   ⚠️ 若以后重新构建又忘了带 --base，此配置无需改，但前端会回到子路径 404 的老问题。
# =============================================================

# Cloudflare 会带 X-Forwarded-Proto: https；没有（直连本机）就回落 $scheme
# proxy_set_header 只能接「头名 + 一个值」，故用 map 做二选一
map $http_x_forwarded_proto $forwarded_proto {
    ''      $scheme;
    default $http_x_forwarded_proto;
}

server {
    listen 80;
    listen [::]:80;
    server_name voz21.cn _;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # 根路径顺手跳到桌面端
    location = / {
        return 302 /z1/;
    }
    # 归一到带斜杠的入口：/z1、/z1/index.html（以及移动端两个）都 302 到 /z1/、/z1-app/。
    # 否则「裸文件名 /z1/index.html」会被 SPA 路由当成路径 /index.html 而落进应用内 404；
    # 「无斜杠 /z1」则匹配不到 location /z1/ 而返回 nginx 404。这俩都不是服务器错误，是 SPA 路由特性。
    location = /z1          { return 302 /z1/; }
    location = /z1/index.html { return 302 /z1/; }
    location = /z1-app       { return 302 /z1-app/; }
    location = /z1-app/index.html { return 302 /z1-app/; }

    # ---------- 后端 API ----------
    location /z1/api/ {
        proxy_pass http://127.0.0.1:8090;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
    }

    # ---------- 后端头像 / 上传静态 ----------
    location /z1/uploads/ {
        proxy_pass http://127.0.0.1:8090;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
    }

    # ---------- 桌面端静态：/z1/ ----------
    # 产物已带 /z1/ base：资源自描述，无需改写。带 hash 的构建产物长缓存。
    location /z1/assets/ {
        alias /var/www/z1/assets/;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
    location /z1/ {
        alias /var/www/z1/;
        index index.html;
        # SPA history 路由兜底：/z1/home、/z1/todo/xxx 等深层链接都回 index.html
        try_files $uri $uri/ /z1/index.html;
    }

    # ---------- 移动端静态：/z1-app/ ----------
    location /z1-app/assets/ {
        alias /var/www/z1-app/assets/;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
    location /z1-app/ {
        alias /var/www/z1-app/;
        index index.html;
        try_files $uri $uri/ /z1-app/index.html;
    }
}
